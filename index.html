<!DOCTYPE html>
<html lang="es" class="antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscripciones - C.A. Central Norte</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cuervo: { 50: '#f6f6f6', 800: '#1a1a1a', 900: '#0a0a0a' },
                        gold: { 50: '#fcfaf5', 500: '#d4af37', 700: '#aa7c11', 900: '#785709' },
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        serif: ['Cinzel', 'Georgia', 'serif'],
                    },
                }
            }
        }
    </script>
    
    <style>
        body { background-color: #f6f6f6; color: #1a1a1a; overflow-x: hidden; }

        .table-container::-webkit-scrollbar { width: 8px; height: 8px; }
        .table-container::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        .table-container::-webkit-scrollbar-thumb { background: #d4af37; border-radius: 4px; }

        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="number"] { -moz-appearance: textfield; }

        .text-gradient-gold-dark {
            background: linear-gradient(to bottom, #aa7c11 0%, #785709 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* LÓGICA DE IMPRESIÓN EXTREMA - BLOQUEO DE MARCAS DE AGUA */
        @media print {
            @page { 
                size: A4 portrait !important; 
                margin: 0mm !important; /* CRÍTICO: Bloquea las cabeceras/URL del navegador */
            }
            html, body { 
                width: 210mm !important;
                height: 100% !important;
                margin: 0 !important; 
                padding: 0 !important;
                background-color: white !important; 
                -webkit-print-color-adjust: exact; 
                print-color-adjust: exact; 
            }
            header, #form-section, .no-print, #toast-container { 
                display: none !important; 
            }
            
            /* Eliminación de sangrados (padding/margin bleed) en contenedores padre */
            #print-section, #carnetsContainer, #listPrintContainer { 
                display: flex !important; 
                width: 100% !important; 
                margin: 0 !important; 
                padding: 0 !important; 
                background: white !important;
                position: absolute !important;
                top: 0 !important;
                left: 0 !important;
            }

            .print-hide { display: none !important; }
            
            .a4-page, .a4-list-page {
                margin: 0 !important; 
                box-shadow: none !important; 
                border: none !important; 
                transform: none !important; 
                page-break-after: always; 
                page-break-inside: avoid;
            }
        }
        
        /* HOJA A4 CARNETS */
        .a4-page { 
            width: 210mm; 
            height: 297mm; 
            background: white; 
            padding: 11mm 10mm; 
            display: grid; 
            grid-template-columns: 95mm 95mm; 
            grid-template-rows: repeat(5, 55mm); 
            gap: 0; 
            box-sizing: border-box;
            transition: transform 0.3s ease; 
        }
        
        /* HOJA A4 LISTA (Estricto 1 Hoja) */
        .a4-list-page {
            width: 210mm;
            height: 297mm; /* Bloqueado a 297 exactos */
            max-height: 297mm;
            overflow: hidden; /* Evita que desborde a la hoja 2 */
            background: white;
            padding: 15mm;
            box-sizing: border-box;
            transition: transform 0.3s ease;
        }

        .carnet-wrapper {
            width: 95mm; 
            height: 55mm; 
            box-sizing: border-box; 
            border: 1px solid #e5e7eb; 
            position: relative; 
            overflow: hidden; 
            background: white;
        }
        
        .reverso-wrapper {
            border: none;
            background-color: transparent;
            background-size: cover;
            background-position: center;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-3px); }
            75% { transform: translateX(3px); }
        }
        .input-error { 
            border-bottom-color: #ef4444 !important; 
            background-color: #fef2f2 !important; 
            animation: shake 0.3s ease-in-out; 
        }
        
        .hp-field {
            opacity: 0;
            position: absolute;
            top: 0;
            left: 0;
            height: 0;
            width: 0;
            z-index: -1;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col selection:bg-gold-500 selection:text-white">

    <header class="relative border-b-4 border-gold-500 bg-white shadow-sm py-12 overflow-hidden">
        <img id="shield-watermark" class="hidden absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-48 h-48 object-contain opacity-5 pointer-events-none no-print transition-opacity duration-500" alt="Escudo Organización" />
        
        <div class="max-w-7xl mx-auto px-4 flex flex-col items-center justify-center text-center relative z-10 pointer-events-none">
            <h1 class="text-4xl md:text-5xl font-black font-serif tracking-widest uppercase text-gradient-gold-dark drop-shadow-sm">Copa Central</h1>
            <h2 class="text-xl md:text-2xl font-bold font-serif tracking-[0.2em] uppercase text-gray-800 mt-2">Intercolegial</h2>
            <p class="text-sm md:text-base text-gray-500 font-medium tracking-[0.3em] uppercase mt-4">Embarcación, Salta - 2026</p>
        </div>
    </header>

    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
        
        <div id="form-section">
            <div class="bg-white rounded-xl shadow-md border border-gray-200 overflow-hidden flex flex-col">
                <div class="px-6 py-5 border-b border-gray-200 bg-gray-50 flex justify-between items-center">
                    <div>
                        <h2 id="dev-trigger" class="text-lg font-bold font-serif text-gray-900 uppercase tracking-wide cursor-default select-none">Planilla de Inscripción</h2>
                        <p class="text-sm text-gray-500 mt-1">Complete los datos del Colegio y los jugadores.</p>
                    </div>
                    <button type="button" id="btnClearCache" class="text-xs font-medium text-red-500 hover:text-red-700 transition-colors hidden sm:flex items-center">
                        <i data-lucide="trash-2" class="w-3 h-3 mr-1"></i> Borrar Datos
                    </button>
                </div>

                <form id="registrationForm" class="flex flex-col">
                    
                    <input type="text" id="honey_pot_field" name="website_url" class="hp-field" tabindex="-1" autocomplete="off">

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 p-6 border-b border-gray-100 bg-white">
                        <div>
                            <label class="block text-sm font-bold text-gray-700 uppercase mb-2">Nombre del Equipo</label>
                            <input type="text" id="inputEquipo" required placeholder="Ej: LOS LEONES FC" oninput="this.value = this.value.toUpperCase()"
                                class="w-full border-b-2 border-gray-300 py-2 focus:outline-none focus:border-gold-500 font-medium transition-colors bg-transparent">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-gray-700 uppercase mb-2">Colegio</label>
                            <input type="text" id="inputColegio" required placeholder="Ej: COLEGIO NACIONAL" oninput="this.value = this.value.toUpperCase()"
                                class="w-full border-b-2 border-gray-300 py-2 focus:outline-none focus:border-gold-500 font-medium transition-colors bg-transparent">
                        </div>
                    </div>

                    <div class="table-container overflow-x-auto w-full">
                        <table class="min-w-full divide-y divide-gray-200">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th scope="col" class="px-4 py-3 text-xs font-bold text-gray-500 uppercase tracking-wider text-center w-12 border-r border-gray-200">Nº</th>
                                    <th scope="col" class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider min-w-[250px]">Nombre y Apellido</th>
                                    <th scope="col" class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider min-w-[150px]">DNI</th>
                                    <th scope="col" class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider min-w-[160px]">Fecha Nac.</th>
                                    <th scope="col" class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider min-w-[180px]">Curso</th>
                                </tr>
                            </thead>
                            <tbody id="formRows" class="bg-white divide-y divide-gray-100">
                            </tbody>
                            <tbody class="bg-gray-100 border-t-2 border-gray-300">
                                <tr>
                                    <td class="px-4 py-4 text-xs font-black font-serif text-gray-700 text-center border-r border-gray-200 bg-gray-200">DEL</td>
                                    <td class="px-6 py-3">
                                        <input type="text" id="nombre_del" placeholder="Nombre del Delegado" oninput="this.value = this.value.replace(/[^a-zA-ZáéíóúÁÉÍÓÚñÑ\s]/g, '').toUpperCase()"
                                            class="w-full rounded-none border-b border-gray-300 py-1 px-2 text-gray-900 bg-transparent focus:border-gold-500 focus:outline-none text-sm font-bold placeholder:font-normal">
                                    </td>
                                    <td class="px-6 py-3">
                                        <input type="text" id="dni_del" maxlength="8" placeholder="DNI" oninput="this.value = this.value.replace(/[^0-9]/g, '')"
                                            class="w-full rounded-none border-b border-gray-300 py-1 px-2 text-gray-900 bg-transparent focus:border-gold-500 focus:outline-none text-sm font-mono font-bold placeholder:font-normal">
                                    </td>
                                    <td class="px-6 py-3">
                                        <input type="date" id="fecha_del" 
                                            class="w-full rounded-none border-b border-gray-300 py-1 px-2 text-gray-900 bg-transparent focus:border-gold-500 focus:outline-none text-sm font-bold">
                                    </td>
                                    <td class="px-6 py-3">
                                        <input type="text" id="curso_del" value="DELEGADO" readonly disabled
                                            class="w-full rounded-none py-1 px-2 text-gray-500 bg-transparent text-sm font-black italic cursor-not-allowed">
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    
                    <div class="px-6 py-8 bg-gray-50 border-t border-gray-200 flex justify-center">
                        <button type="submit" class="inline-flex items-center justify-center w-full sm:w-auto px-10 py-4 border-2 border-cuervo-900 text-lg font-bold tracking-wide rounded-lg text-white bg-cuervo-900 hover:bg-cuervo-800 hover:border-cuervo-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gold-500 shadow-lg transition-all duration-300 uppercase">
                            <i data-lucide="layout-grid" class="w-6 h-6 mr-3"></i> Revisar y Generar Carnets
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <div id="print-section" class="hidden flex-col items-center w-full bg-cuervo-900 min-h-screen py-10 overflow-x-hidden">
            <div class="w-full max-w-[210mm] flex justify-between items-center mb-6 no-print gap-4 flex-wrap bg-white p-4 rounded-lg shadow-lg relative z-20">
                <button type="button" id="btnBackToForm" class="inline-flex items-center px-4 py-2 bg-white border border-gray-300 rounded-md text-sm font-bold uppercase text-gray-700 hover:bg-gray-50 transition-all">
                    <i data-lucide="arrow-left" class="w-4 h-4 mr-2"></i> Editar Datos
                </button>
                <div class="flex gap-2 flex-wrap justify-end">
                    <button type="button" id="btnSendEmail" class="inline-flex items-center px-4 py-2 bg-blue-600 rounded-md text-sm font-bold uppercase text-white hover:bg-blue-700 transition-all shadow-sm">
                        <i data-lucide="mail" class="w-4 h-4 mr-2"></i> Confirmar y Enviar
                    </button>
                    <button type="button" id="btnExportList" class="inline-flex items-center px-4 py-2 bg-gray-800 rounded-md text-sm font-bold uppercase text-white hover:bg-gray-900 transition-all shadow-sm">
                        <i data-lucide="table" class="w-4 h-4 mr-2"></i> Ver Lista
                    </button>
                    <button type="button" id="btnExportPDF" class="inline-flex items-center px-4 py-2 bg-gold-500 rounded-md text-sm font-bold uppercase text-white hover:bg-gold-700 transition-all shadow-sm">
                        <i data-lucide="printer" class="w-4 h-4 mr-2"></i> Imprimir Carnets
                    </button>
                </div>
            </div>
            
            <div id="carnetsContainer" class="w-full flex flex-col items-center pb-10"></div>
            
            <div id="listPrintContainer" class="hidden w-full flex-col items-center pb-10"></div>

        </div>
    </main>

    <div id="toast-container" class="fixed top-5 left-1/2 transform -translate-x-1/2 z-50 flex flex-col gap-3 pointer-events-none w-[90%] sm:w-auto max-w-md"></div>

    <script>
        lucide.createIcons();

        const URL_ESCUDO = "./ESCUDO.png";
        const URL_REVERSO = "./CARNETDEJUGADOR.png";
        const CORREO_DESTINATARIO = "clubatleticocentraln@gmail.com"; 
        const LS_PREFIX = "copa_central_2026_";

        const formRowsContainer = document.getElementById('formRows');
        const registrationForm = document.getElementById('registrationForm');
        const formSection = document.getElementById('form-section');
        const printSection = document.getElementById('print-section');
        const carnetsContainer = document.getElementById('carnetsContainer');
        const listPrintContainer = document.getElementById('listPrintContainer');
        
        const btnBackToForm = document.getElementById('btnBackToForm');
        const btnSendEmail = document.getElementById('btnSendEmail');
        const btnExportPDF = document.getElementById('btnExportPDF');
        const btnExportList = document.getElementById('btnExportList');
        const btnClearCache = document.getElementById('btnClearCache');

        const inputEquipo = document.getElementById('inputEquipo');
        const inputColegio = document.getElementById('inputColegio');
        const hpField = document.getElementById('honey_pot_field');
        const shieldWatermark = document.getElementById('shield-watermark');
        const devTrigger = document.getElementById('dev-trigger');

        const TOTAL_ROWS = 16;
        let validData = []; 
        let metadata = {};

        if (URL_ESCUDO.trim() !== "") {
            shieldWatermark.src = URL_ESCUDO;
            shieldWatermark.classList.remove('hidden');
        }

        let clickCount = 0;
        let clickTimer = null;

        devTrigger.addEventListener('click', () => {
            clickCount++;
            if (clickCount === 1) {
                clickTimer = setTimeout(() => { clickCount = 0; }, 1000);
            } else if (clickCount === 3) {
                clearTimeout(clickTimer);
                clickCount = 0;
                
                inputEquipo.value = "SAN MARTÍN MOCK";
                inputColegio.value = "E.E.T. N° 3115"; 

                for (let i = 1; i <= TOTAL_ROWS; i++) {
                    document.querySelector(`input[name="nombre_${i}"]`).value = `JUGADOR DE PRUEBA ${i}`;
                    document.querySelector(`input[name="dni_${i}"]`).value = Math.floor(40000000 + Math.random() * 10000000);
                    document.querySelector(`input[name="fecha_${i}"]`).value = "2010-06-15"; 
                    document.querySelector(`input[name="curso_${i}"]`).value = "3ER AÑO";
                }

                document.getElementById('nombre_del').value = "CARLOS BIANCHI";
                document.getElementById('dni_del').value = "20123456";
                document.getElementById('fecha_del').value = "1975-10-22";

                registrationForm.dispatchEvent(new Event('input', { bubbles: true }));
                showToast("Modo de Testeo Activado: Planilla autocompletada y guardada.", "success");
            }
        });

        function generateRows() {
            let html = '';
            for (let i = 1; i <= TOTAL_ROWS; i++) {
                const bgClass = i % 2 === 0 ? 'bg-gray-50/50' : 'bg-white';
                const onInputName = "this.value = this.value.replace(/[^a-zA-ZáéíóúÁÉÍÓÚñÑ\\s]/g, '').toUpperCase()";
                const onInputDni = "this.value = this.value.replace(/[^0-9]/g, '').slice(0, 8)";
                const onInputCourse = "this.value = this.value.replace(/[^a-zA-Z0-9\\sñÑ]/g, '').toUpperCase()";

                html += `
                    <tr class="${bgClass} hover:bg-gold-50/30 transition-colors">
                        <td class="px-4 py-3 text-sm font-bold font-serif text-gray-400 text-center border-r border-gray-100">${i}</td>
                        <td class="px-6 py-2">
                            <input type="text" id="nombre_${i}" name="nombre_${i}" oninput="${onInputName}"
                                class="row-input w-full rounded-none border-b border-gray-200 py-1 px-2 text-gray-900 bg-transparent focus:border-gold-500 focus:outline-none text-sm font-medium transition-colors">
                        </td>
                        <td class="px-6 py-2">
                            <input type="text" id="dni_${i}" name="dni_${i}" maxlength="8" oninput="${onInputDni}"
                                class="row-input w-full rounded-none border-b border-gray-200 py-1 px-2 text-gray-900 bg-transparent focus:border-gold-500 focus:outline-none text-sm font-mono tracking-wider transition-colors">
                        </td>
                        <td class="px-6 py-2">
                            <input type="date" id="fecha_${i}" name="fecha_${i}" 
                                class="row-input w-full rounded-none border-b border-gray-200 py-1 px-2 text-gray-900 bg-transparent focus:border-gold-500 focus:outline-none text-sm transition-colors">
                        </td>
                        <td class="px-6 py-2">
                            <input type="text" id="curso_${i}" name="curso_${i}" maxlength="15" oninput="${onInputCourse}"
                                class="row-input w-full rounded-none border-b border-gray-200 py-1 px-2 text-gray-900 bg-transparent focus:border-gold-500 focus:outline-none text-sm font-medium transition-colors">
                        </td>
                    </tr>
                `;
            }
            formRowsContainer.innerHTML = html;
        }

        generateRows();

        function saveFormData(event) {
            const el = event.target;
            if (!el.id || el.id === 'honey_pot_field' || el.readOnly || el.disabled) return;
            const value = (el.type === 'checkbox' || el.type === 'radio') ? el.checked : el.value;
            localStorage.setItem(LS_PREFIX + el.id, value);
        }

        registrationForm.addEventListener('input', saveFormData);
        registrationForm.addEventListener('change', saveFormData);

        function loadFormData() {
            const elements = registrationForm.elements;
            let loadedCount = 0;

            for (let el of elements) {
                if (!el.id || el.id === 'honey_pot_field') continue;
                const savedValue = localStorage.getItem(LS_PREFIX + el.id);
                if (savedValue !== null) {
                    if (el.type === 'checkbox' || el.type === 'radio') {
                        el.checked = (savedValue === 'true'); 
                    } else {
                        el.value = savedValue;
                    }
                    loadedCount++;
                }
            }
            if(loadedCount > 0) {
                showToast("Borrador recuperado. Puede continuar editando.", "success");
            }
        }

        function clearFormData() {
            const elements = registrationForm.elements;
            for (let el of elements) {
                if (el.id && el.id !== 'honey_pot_field') {
                    localStorage.removeItem(LS_PREFIX + el.id);
                }
            }
        }

        btnClearCache.addEventListener('click', () => {
            if(confirm("¿Estás seguro de que quieres borrar todos los datos ingresados?")) {
                clearFormData();
                registrationForm.reset();
                showToast("Datos borrados correctamente.", "success");
            }
        });

        document.addEventListener('DOMContentLoaded', loadFormData);

        function showToast(message, type = 'warning') {
            const toast = document.createElement('div');
            const bgColor = type === 'error' ? 'bg-red-600' : (type === 'success' ? 'bg-green-600' : 'bg-gray-800');
            const icon = type === 'error' ? 'alert-circle' : (type === 'success' ? 'check-circle' : 'info');
            
            toast.className = `${bgColor} text-white px-4 py-3 rounded-md shadow-lg flex items-center text-sm font-medium transition-all duration-300 transform -translate-y-full opacity-0`;
            toast.innerHTML = `<i data-lucide="${icon}" class="w-4 h-4 mr-2"></i> ${message}`;
            
            document.getElementById('toast-container').appendChild(toast);
            lucide.createIcons();

            requestAnimationFrame(() => {
                toast.classList.remove('-translate-y-full', 'opacity-0');
                toast.classList.add('translate-y-0', 'opacity-100');
            });

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('-translate-y-full', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        registrationForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            if (hpField.value.trim() !== "") {
                console.warn("Spam detectado. Transacción abortada.");
                return;
            }
            
            document.querySelectorAll('.input-error').forEach(el => el.classList.remove('input-error'));
            
            validData = [];
            metadata = {
                equipo: inputEquipo.value.trim(),
                colegio: inputColegio.value.trim()
            };
            
            let hasIncompleteRows = false;
            let rowsWithAnyData = 0;
            let hasAgeError = false;

            for (let i = 1; i <= TOTAL_ROWS; i++) {
                const iNombre = document.querySelector(`input[name="nombre_${i}"]`);
                const iDni = document.querySelector(`input[name="dni_${i}"]`);
                const iFecha = document.querySelector(`input[name="fecha_${i}"]`);
                const iCurso = document.querySelector(`input[name="curso_${i}"]`);

                const vNombre = iNombre.value.trim();
                const vDni = iDni.value.trim();
                const vFecha = iFecha.value;
                const vCurso = iCurso.value.trim();

                const filledCount = [vNombre, vDni, vFecha, vCurso].filter(v => v !== '').length;

                if (filledCount > 0) {
                    rowsWithAnyData++;
                    if (filledCount < 4) {
                        hasIncompleteRows = true;
                        if (!vNombre) iNombre.classList.add('input-error');
                        if (!vDni) iDni.classList.add('input-error');
                        if (!vFecha) iFecha.classList.add('input-error');
                        if (!vCurso) iCurso.classList.add('input-error');
                    } else {
                        const yearInt = parseInt(vFecha.split('-')[0], 10);
                        if (yearInt >= 2016) {
                            hasAgeError = true;
                            iFecha.classList.add('input-error');
                            showToast(`Fila ${i}: edad no permitida para el campeonato.`, "error");
                        } else if (yearInt <= 2007) {
                            hasAgeError = true;
                            iFecha.classList.add('input-error');
                            showToast(`Fila ${i}: edad no permitida para el campeonato.`, "error");
                        } else {
                            validData.push({ i, nombre: vNombre, dni: vDni, fecha: vFecha, curso: vCurso, isDelegate: false });
                        }
                    }
                }
            }

            const delNombre = document.getElementById('nombre_del');
            const delDni = document.getElementById('dni_del');
            const delFecha = document.getElementById('fecha_del');
            
            const vDelNombre = delNombre.value.trim();
            const vDelDni = delDni.value.trim();
            const vDelFecha = delFecha.value;
            
            const delFilledCount = [vDelNombre, vDelDni, vDelFecha].filter(v => v !== '').length;

            if (delFilledCount > 0) {
                rowsWithAnyData++;
                if (delFilledCount < 3) {
                    hasIncompleteRows = true;
                    if (!vDelNombre) delNombre.classList.add('input-error');
                    if (!vDelDni) delDni.classList.add('input-error');
                    if (!vDelFecha) delFecha.classList.add('input-error');
                } else {
                    validData.push({ i: 'DEL', nombre: vDelNombre, dni: vDelDni, fecha: vDelFecha, curso: 'DELEGADO', isDelegate: true });
                }
            }

            if (hasAgeError) return; 
            if (rowsWithAnyData === 0) {
                showToast("La planilla está vacía. Complete al menos un jugador o el delegado.", "error");
                return;
            }
            if (hasIncompleteRows) {
                showToast("Hay filas incompletas resaltadas en rojo. Llene todos los datos de esa fila.", "error");
                return;
            }

            clearFormData();

            renderCarnets(validData, metadata);
            renderList(validData, metadata); 
            formSection.classList.add('hidden');
            printSection.classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
            
            setTimeout(applyResponsiveScale, 50);
        });

        btnBackToForm.addEventListener('click', () => {
            printSection.classList.add('hidden');
            formSection.classList.remove('hidden');
            const elements = registrationForm.elements;
            for (let el of elements) {
                if (el.id && el.id !== 'honey_pot_field') {
                    const value = (el.type === 'checkbox' || el.type === 'radio') ? el.checked : el.value;
                    localStorage.setItem(LS_PREFIX + el.id, value);
                }
            }
        });

        btnExportPDF.addEventListener('click', () => {
            const originalTitle = document.title;
            document.title = `${metadata.equipo}_Carnets_2026`;
            
            carnetsContainer.classList.remove('print-hide');
            listPrintContainer.classList.add('print-hide');
            
            window.print();
            
            setTimeout(() => { document.title = originalTitle; }, 500);
        });

        btnExportList.addEventListener('click', () => {
            const originalTitle = document.title;
            document.title = `Lista_Oficial_${metadata.equipo}_2026`;
            
            carnetsContainer.classList.add('hidden', 'print-hide');
            listPrintContainer.classList.remove('hidden', 'print-hide');
            
            const pages = document.querySelectorAll('.a4-list-page');
            pages.forEach(p => p.style.transform = 'none');
            
            window.print();
            
            setTimeout(() => { 
                document.title = originalTitle; 
                carnetsContainer.classList.remove('hidden', 'print-hide');
                listPrintContainer.classList.add('hidden', 'print-hide');
                applyResponsiveScale();
            }, 1000);
        });

        function applyResponsiveScale() {
            const screenWidth = window.innerWidth;
            const targetWidth = 830; 
            
            const pages = document.querySelectorAll('.a4-page');
            pages.forEach(page => {
                if (screenWidth < targetWidth) {
                    const scale = screenWidth / targetWidth;
                    page.style.transform = `scale(${scale})`;
                    page.style.transformOrigin = 'top center';
                    page.style.marginBottom = `calc(-${297 * (1 - scale)}mm + 20px)`; 
                } else {
                    page.style.transform = 'none';
                    page.style.marginBottom = '3rem'; 
                }
            });
            
            const listPages = document.querySelectorAll('.a4-list-page');
            listPages.forEach(page => {
                if (screenWidth < targetWidth) {
                    const scale = screenWidth / targetWidth;
                    page.style.transform = `scale(${scale})`;
                    page.style.transformOrigin = 'top center';
                } else {
                    page.style.transform = 'none';
                }
            });
        }

        window.addEventListener('resize', applyResponsiveScale);

        // =========================================================================
        // MOTOR DE RENDERIZADO CARNETS (FUENTES AUMENTADAS)
        // =========================================================================
        function renderCarnets(data, meta) {
            carnetsContainer.innerHTML = '';
            const ITEMS_PER_PAGE = 10; 
            const totalPages = Math.ceil(data.length / ITEMS_PER_PAGE);

            for (let pageIndex = 0; pageIndex < totalPages; pageIndex++) {
                const pageDiv = document.createElement('div');
                pageDiv.className = 'a4-page shadow-2xl mb-12'; 
                const startIdx = pageIndex * ITEMS_PER_PAGE;
                const pageData = data.slice(startIdx, startIdx + ITEMS_PER_PAGE);

                for (let i = 0; i < ITEMS_PER_PAGE; i++) {
                    const jugador = pageData[i];
                    if (jugador) {
                        const [y, m, d] = jugador.fecha.split('-');
                        const fechaFormateada = `${d}/${m}/${y}`;
                        const displayNombre = jugador.isDelegate ? `${jugador.nombre} (DEL)` : jugador.nombre;
                        const wrapper = document.createElement('div');
                        wrapper.className = 'carnet-wrapper';
                        
                        // NOTA DE ACTUALIZACIÓN: 
                        // Título central: text-[13px] (Antes 11px)
                        // Label izquierdo: text-[5.5px] (Antes 4.2px)
                        // Texto derecho: text-[7px] (Antes 5px)
                        wrapper.innerHTML = `
                            <div class="absolute top-0 left-0 w-[14mm] h-[14mm] z-0" style="background: repeating-linear-gradient(-45deg, transparent, transparent 1mm, #7B1220 1mm, #7B1220 2mm); clip-path: polygon(0 0, 100% 0, 0 100%);"></div>
                            <div class="absolute top-0 right-0 w-[14mm] h-[14mm] z-0" style="background: repeating-linear-gradient(45deg, transparent, transparent 1mm, #7B1220 1mm, #7B1220 2mm); clip-path: polygon(0 0, 100% 0, 100% 100%);"></div>
                            <div class="absolute bottom-0 left-0 w-[18mm] h-[18mm] z-0 flex">
                                <div class="absolute bottom-0 left-0 w-[8mm] h-[8mm] bg-[#7B1220]"></div>
                                <div class="absolute bottom-0 left-[2mm] w-[16mm] h-[16mm]" style="background: repeating-linear-gradient(45deg, transparent, transparent 1mm, #7B1220 1mm, #7B1220 2mm); clip-path: polygon(0 100%, 100% 100%, 0 0);"></div>
                            </div>
                            <div class="relative z-10 flex flex-col h-full w-full p-[3mm]">
                                <div class="flex items-center justify-center w-full mb-[2mm]">
                                    <h3 class="font-sans font-black uppercase text-[13px] leading-none tracking-tight text-[#7B1220]">COPA CENTRAL: INTERCOLEGIAL</h3>
                                </div>
                                <div class="flex flex-1 w-full gap-[2.5mm]">
                                    <div class="w-[30%] aspect-square shrink-0 self-center flex flex-col relative bg-[#7B1220] shadow-[0_3px_5px_rgba(0,0,0,0.5)] overflow-hidden">
                                        <div class="absolute top-0 left-0 w-[150%] h-[150%] bg-gradient-to-br from-black/60 via-transparent to-transparent pointer-events-none -translate-x-[20%] -translate-y-[20%]"></div>
                                        <div class="absolute -bottom-[8mm] -right-[8mm] w-[22mm] h-[22mm] bg-white transform rotate-45 z-0"></div>
                                        <div class="flex-1 w-full flex items-center justify-center relative z-10 pt-[2.5mm] pb-[1mm]">
                                            <svg viewBox="0 0 100 100" class="w-[85%] h-[85%] overflow-visible">
                                                <circle cx="50" cy="50" r="44" fill="none" stroke="white" stroke-width="3"/>
                                                <circle cx="50" cy="35" r="15" fill="#7B1220" stroke="white" stroke-width="3"/>
                                                <path d="M 21 78 C 21 55, 79 55, 79 78 C 79 80, 21 80, 21 78 Z" fill="#7B1220" stroke="white" stroke-width="3" stroke-linejoin="round"/>
                                            </svg>
                                        </div>
                                        <div class="w-[85%] mx-auto bg-white text-center py-[1mm] relative z-20 shadow-sm mb-[1mm]">
                                            <span class="text-[5.5px] font-black text-[#7B1220] tracking-wider block leading-none">FOTO 4x4</span>
                                        </div>
                                    </div>
                                    <div class="w-[70%] flex flex-col justify-between h-full space-y-[1.5mm]">
                                        <div class="flex items-stretch bg-white shadow-[0_1.5px_3px_rgba(0,0,0,0.3)] h-full w-full rounded-[1px] overflow-hidden">
                                            <div class="bg-[#7B1220] text-white text-[5.5px] font-bold px-[1.5mm] flex items-center w-[48%] shrink-0 leading-none tracking-tight overflow-hidden">NOMBRE:</div>
                                            <div class="text-[#7B1220] text-[7px] font-black px-[1.5mm] flex items-center truncate w-[52%] leading-tight uppercase">${displayNombre}</div>
                                        </div>
                                        <div class="flex items-stretch bg-white shadow-[0_1.5px_3px_rgba(0,0,0,0.3)] h-full w-full rounded-[1px] overflow-hidden">
                                            <div class="bg-[#7B1220] text-white text-[5.5px] font-bold px-[1.5mm] flex items-center w-[48%] shrink-0 leading-none tracking-tight overflow-hidden">FECHA DE NACIMIENTO:</div>
                                            <div class="text-[#7B1220] text-[7px] font-black px-[1.5mm] flex items-center truncate w-[52%] leading-tight uppercase">${fechaFormateada}</div>
                                        </div>
                                        <div class="flex items-stretch bg-white shadow-[0_1.5px_3px_rgba(0,0,0,0.3)] h-full w-full rounded-[1px] overflow-hidden">
                                            <div class="bg-[#7B1220] text-white text-[5.5px] font-bold px-[1.5mm] flex items-center w-[48%] shrink-0 leading-none tracking-tight overflow-hidden">D.N.I:</div>
                                            <div class="text-[#7B1220] text-[7px] font-black px-[1.5mm] flex items-center truncate w-[52%] leading-tight uppercase">${jugador.dni}</div>
                                        </div>
                                        <div class="flex items-stretch bg-white shadow-[0_1.5px_3px_rgba(0,0,0,0.3)] h-full w-full rounded-[1px] overflow-hidden">
                                            <div class="bg-[#7B1220] text-white text-[5.5px] font-bold px-[1.5mm] flex items-center w-[48%] shrink-0 leading-none tracking-tight overflow-hidden">COLEGIO:</div>
                                            <div class="text-[#7B1220] text-[7px] font-black px-[1.5mm] flex items-center truncate w-[52%] leading-tight uppercase">${meta.colegio} - ${jugador.curso}</div>
                                        </div>
                                        <div class="flex items-stretch bg-white shadow-[0_1.5px_3px_rgba(0,0,0,0.3)] h-full w-full rounded-[1px] overflow-hidden">
                                            <div class="bg-[#7B1220] text-white text-[5.5px] font-bold px-[1.5mm] flex items-center w-[48%] shrink-0 leading-none tracking-tight overflow-hidden">EQUIPO:</div>
                                            <div class="text-[#7B1220] text-[7px] font-black px-[1.5mm] flex items-center truncate w-[52%] leading-tight uppercase">${meta.equipo}</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `;
                        pageDiv.appendChild(wrapper);
                    } else {
                        pageDiv.innerHTML += `<div class="carnet-wrapper" style="border: none; background: transparent;"></div>`;
                    }
                }
                carnetsContainer.appendChild(pageDiv);

                if (URL_REVERSO.trim() !== "") {
                    const backPageDiv = document.createElement('div');
                    backPageDiv.className = 'a4-page shadow-2xl mb-12'; 
                    for (let i = 0; i < 10; i += 2) {
                        const leftCardData = pageData[i]; 
                        const rightCardData = pageData[i + 1]; 
                        if (rightCardData) {
                            backPageDiv.innerHTML += `<div class="carnet-wrapper reverso-wrapper" style="background-image: url('${URL_REVERSO}');"></div>`;
                        } else {
                            backPageDiv.innerHTML += `<div class="carnet-wrapper" style="border: none; background: transparent;"></div>`;
                        }
                        if (leftCardData) {
                            backPageDiv.innerHTML += `<div class="carnet-wrapper reverso-wrapper" style="background-image: url('${URL_REVERSO}');"></div>`;
                        } else {
                            backPageDiv.innerHTML += `<div class="carnet-wrapper" style="border: none; background: transparent;"></div>`;
                        }
                    }
                    carnetsContainer.appendChild(backPageDiv);
                }
            }
            lucide.createIcons(); 
        }

        // =========================================================================
        // MOTOR DE RENDERIZADO TABULAR (LISTA DE BUENA FE - COMPACTA)
        // =========================================================================
        function renderList(data, meta) {
            let html = `
                <div class="a4-list-page shadow-2xl mb-12 flex flex-col justify-between" style="width: 210mm; height: 297mm; max-height: 297mm; overflow: hidden; background: white;">
                    
                    <div class="flex-grow">
                        <div class="flex justify-between items-center border-b-2 border-gold-500 pb-4 mb-4">
                            <div class="flex items-center gap-4">
                                <img src="${URL_ESCUDO}" class="w-16 h-16 object-contain ${URL_ESCUDO.trim() ? '' : 'hidden'}" />
                                <div>
                                    <h1 class="text-2xl font-black font-serif uppercase tracking-widest text-cuervo-900">Copa Central</h1>
                                    <h2 class="text-sm font-bold uppercase tracking-widest text-gray-500">Lista de Buena Fe</h2>
                                </div>
                            </div>
                            <div class="text-right">
                                <p class="text-sm font-bold text-gray-800 uppercase">Equipo: <span class="text-gold-700">${meta.equipo}</span></p>
                                <p class="text-xs font-bold text-gray-500 uppercase mt-1">Colegio: ${meta.colegio}</p>
                                <p class="text-[10px] text-gray-400 mt-1">Impreso: ${new Date().toLocaleDateString()}</p>
                            </div>
                        </div>

                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-gray-100 border-y-2 border-gray-300">
                                    <th class="py-2 px-4 text-[11px] font-black text-gray-700 uppercase tracking-wider w-12 text-center">Nº</th>
                                    <th class="py-2 px-4 text-[11px] font-black text-gray-700 uppercase tracking-wider">Nombre y Apellido</th>
                                    <th class="py-2 px-4 text-[11px] font-black text-gray-700 uppercase tracking-wider text-center">D.N.I.</th>
                                    <th class="py-2 px-4 text-[11px] font-black text-gray-700 uppercase tracking-wider text-center">Nacimiento</th>
                                    <th class="py-2 px-4 text-[11px] font-black text-gray-700 uppercase tracking-wider">Curso / Cat.</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-200 border-b-2 border-gray-300">
            `;
            
            data.forEach((row, index) => {
                const isDel = row.isDelegate;
                const filaStr = isDel ? 'DEL' : row.i;
                const bg = index % 2 === 0 ? 'bg-white' : 'bg-gray-50';
                
                const [y, m, d] = row.fecha.split('-');
                const fechaFormat = `${d}/${m}/${y}`;
                const boldClass = isDel ? 'font-bold bg-gray-100 text-cuervo-900' : 'text-gray-700';

                // Padding reducido (py-1.5 en vez de 2.5) para que no desborde hacia abajo
                html += `
                                <tr class="${bg} ${isDel ? 'border-t-2 border-gray-300' : ''} print:break-inside-avoid">
                                    <td class="py-1.5 px-4 text-xs font-black text-center ${boldClass}">${filaStr}</td>
                                    <td class="py-1.5 px-4 text-xs font-semibold ${boldClass}">${row.nombre}</td>
                                    <td class="py-1.5 px-4 text-xs font-mono text-center ${boldClass}">${row.dni}</td>
                                    <td class="py-1.5 px-4 text-xs text-center ${boldClass}">${fechaFormat}</td>
                                    <td class="py-1.5 px-4 text-xs font-medium ${boldClass}">${row.curso}</td>
                                </tr>
                `;
            });
            
            // mt-auto fuerza que las firmas se vayan exactamente al final de la hoja A4
            html += `
                            </tbody>
                        </table>
                    </div>

                    <div class="mt-auto pt-4 pb-6 flex justify-around w-full shrink-0">
                        <div class="text-center w-64">
                            <div class="border-b border-gray-800 w-full mb-2"></div>
                            <p class="text-xs font-bold text-gray-800 uppercase tracking-wide">Firma Delegado Responsable</p>
                            <p class="text-[10px] text-gray-500 mt-1">Aceptación del Reglamento Gral.</p>
                        </div>
                        <div class="text-center w-64">
                            <div class="border-b border-gray-800 w-full mb-2"></div>
                            <p class="text-xs font-bold text-gray-800 uppercase tracking-wide">Sello y Autorización C.A.C.N.</p>
                            <p class="text-[10px] text-gray-500 mt-1">Fiscalización</p>
                        </div>
                    </div>

                </div>
            `;
            
            listPrintContainer.innerHTML = html;
        }

        function generateEmailPlainText(data, meta) {
            let text = `EQUIPO\tCOLEGIO\tTIPO/Nº\tNOMBRE Y APELLIDO\tDNI\tFECHA NAC.\tCURSO\r\n`;
            data.forEach(row => {
                const filaStr = row.isDelegate ? 'DELEGADO' : row.i;
                text += `${meta.equipo}\t${meta.colegio}\t${filaStr}\t${row.nombre}\t${row.dni}\t${row.fecha}\t${row.curso}\r\n`;
            });
            return text;
        }

        btnSendEmail.addEventListener('click', () => {
            const plainTextBody = generateEmailPlainText(validData, metadata);
            const subject = encodeURIComponent(`Inscripción: ${metadata.equipo} - ${metadata.colegio}`);
            const body = encodeURIComponent(plainTextBody);
            window.location.href = `mailto:${CORREO_DESTINATARIO}?subject=${subject}&body=${body}`;
        });

    </script>
</body>
</html>
